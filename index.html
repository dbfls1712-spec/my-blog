<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RIN 블로그">
  <title>RIN</title>
  <script>
    // 첫 화면 깜빡임을 막기 위해 CSS보다 먼저 테마를 적용합니다.
    (() => {
      let theme = null;
      try {
        theme = localStorage.getItem('theme');
      } catch (e) {
        // 사생활 보호 모드 등에서는 저장소를 쓸 수 없습니다.
      }
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <!-- 손글씨체 웹 글꼴 (Google Fonts의 Gaegu). 불러오지 못하면 시스템 글꼴로 보입니다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="container site-header-inner">
      <a class="site-title" href="#/">RIN</a>
      <button class="theme-toggle" type="button" aria-label="다크 모드로 전환">
        <svg class="icon icon-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </g>
        </svg>
      </button>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <p class="status">불러오는 중…</p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© RIN</p>
    </div>
  </footer>
</body>
</html>
